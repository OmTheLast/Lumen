# Cloudflare Workers configuration for https://lumen.ompatnaik.com
name = "lumen"
main = "src/worker.js"
compatibility_date = "2026-08-12"
workers_dev = false

[[routes]]
pattern = "lumen.ompatnaik.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

      <circle cx="-38" cy="-64" r="3.5" fill="#ff9122"/>
      <circle cx="18" cy="72" r="3.8" fill="#ffd184"/>
      <circle cx="72" cy="-38" r="4.2" fill="#ffad3c"/>
      <circle cx="92" cy="18" r="3" fill="#ff7b18"/>
      <circle cx="24" cy="84" r="2.8" fill="#ffc66b"/>
      <circle cx="-60" cy="70" r="3.2" fill="#ff8b1a"/>

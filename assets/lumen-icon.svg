    <path d="M-74,48 C-16,-88 76,-68 90,24 C35,88 -42,76 -88,-10" fill="none" stroke="#ffc66b" stroke-width="1.25" opacity="0.48"/>
    <path d="M-96,4 C-20,-30 42,-28 98,16" fill="none" stroke="#ff7b18" stroke-width="1.4" opacity="0.54"/>
    <path d="M-68,-58 C-26,24 12,50 78,66" fill="none" stroke="#ffb34d" stroke-width="1.1" opacity="0.45"/>
    <path d="M-80,44 L-38,-64 L18,72 L72,-38 L92,18 L24,84 L-60,70 L-92,-4 Z" fill="none" stroke="#f28a19" stroke-width="1.1" opacity="0.52"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Lumen icon</title>
  <desc id="desc">A warm amber light suspended inside a dark circular lens.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#4a2a0e"/>
      <stop offset="0.58" stop-color="#211208"/>
      <stop offset="1" stop-color="#080503"/>
    </radialGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbd7"/>
      <stop offset="0.12" stop-color="#fff2a3"/>
      <stop offset="0.3" stop-color="#ffc45d" stop-opacity="0.96"/>
      <stop offset="0.62" stop-color="#ff8a2a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff6a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd16c" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#9b531b" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#ff9a32" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <circle cx="512" cy="512" r="472" fill="url(#background)"/>
  <circle cx="512" cy="512" r="469" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="512" cy="512" r="382" fill="none" stroke="#f59a35" stroke-opacity="0.16" stroke-width="3"/>
  <circle cx="512" cy="512" r="210" fill="#ff8a2a" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="238" fill="url(#light)"/>
  <path d="M512 243v144M512 637v144M243 512h144M637 512h144" stroke="#ffc568" stroke-linecap="round" stroke-opacity="0.22" stroke-width="12"/>
  <circle cx="512" cy="512" r="68" fill="#fff5b3" opacity="0.2" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="35" fill="#fffce5"/>
</svg>

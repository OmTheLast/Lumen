    <circle r="118" fill="none" stroke="#ffc46b" stroke-width="1.15" opacity="0.3"/>
    <circle r="74" fill="none" stroke="#ff7b18" stroke-width="0.9" opacity="0.22"/>

    <ellipse rx="112" ry="46" fill="none" stroke="#ffb34d" stroke-width="2.1" opacity="0.66" transform="rotate(-11)"/>
    <ellipse rx="110" ry="43" fill="none" stroke="#ff8b1a" stroke-width="1.4" opacity="0.42" transform="rotate(54)"/>
    <ellipse rx="104" ry="40" fill="none" stroke="#ffd184" stroke-width="1" opacity="0.36" transform="rotate(108)"/>

    <path d="M0,-116 L0,-78 M0,78 L0,116 M-116,0 L-78,0 M78,0 L116,0" stroke="#ff8b1a" stroke-width="3" stroke-linecap="round" opacity="0.36"/>
    <path d="M82,-82 L56,-56 M-82,82 L-56,56 M-82,-82 L-56,-56 M82,82 L56,56" stroke="#ffc66b" stroke-width="1.4" stroke-linecap="round" opacity="0.26"/>


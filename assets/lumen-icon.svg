<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Lumen icon</title>
  <desc id="desc">A warm orange framework orb with glowing nodes and a moving core.</desc>
  <defs>
    <radialGradient id="tile" cx="50%" cy="48%" r="64%">
      <stop offset="0" stop-color="#ffde91" stop-opacity="0.92"/>
      <stop offset="0.2" stop-color="#ff9824" stop-opacity="0.42"/>
      <stop offset="0.58" stop-color="#642407" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#090301" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9dc"/>
      <stop offset="0.3" stop-color="#ffc75d"/>
      <stop offset="0.72" stop-color="#ff7512" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff7512" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="#110503"/>
  <rect x="17" y="17" width="990" height="990" rx="205" fill="none" stroke="#5b2208" stroke-width="5" opacity="0.78"/>

